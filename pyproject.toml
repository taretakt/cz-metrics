[project]
name = "cz-metrics"
version = "0.1.0"
description = "Code Zero Feed reference implementation: byte-deterministic ambulance system-status metrics"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cz_metrics"]
